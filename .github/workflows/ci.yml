name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: lint
      # The global UV_FROZEN would downgrade --check to a validity-only test.
      - run: env -u UV_FROZEN uv lock --check
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: types
      - run: uv sync --group dev
      - run: uv run mypy

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.11+; this is what makes that claim true.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: tests-${{ matrix.python }}
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest

  e2e:
    name: End to end (real reed)
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: e2e
      - run: uv sync --group dev

      - name: Start reed
        run: docker compose -f e2e/docker-compose.yml up -d --wait

      - name: Index the fixture document
        run: |
          set -euo pipefail
          id=$(curl -sf -F file=@e2e/handbook.md http://localhost:8000/v1/documents | jq -r .document_id)
          echo "uploaded ${id}"
          for _ in $(seq 60); do
            status=$(curl -sf "http://localhost:8000/v1/documents/${id}" | jq -r .status)
            [ "$status" = "ready" ] && break
            [ "$status" = "error" ] && { curl -s "http://localhost:8000/v1/documents/${id}"; exit 1; }
            sleep 2
          done
          [ "$status" = "ready" ] || { echo "ingestion never finished (last: $status)"; exit 1; }

      - name: Drive reed-mcp as an MCP host would
        env:
          REED_MCP_E2E_URL: http://localhost:8000
        run: uv run pytest e2e -v

      - name: Show reed logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color reed
