# The reed the e2e suite runs against in CI: the published image, not a build.
#
# Pinned by tag *and* digest so a moved tag cannot silently change what the
# contract is verified against. Raise both together when adopting a new reed,
# and keep the tag at or above the MIN_REED_VERSION the server enforces.
name: reed-mcp-e2e

services:
  reed:
    image: ghcr.io/ulzuhan/reed:0.6.0@sha256:c37927552bc0b5bc8363444144913a0545c5cdfbb4bf9252791c62621b9fd588
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Deterministic stand-in models: no API keys, no model downloads, and the
      # same retrieval and citation code paths as a real profile.
      - REED_PROFILE=fake
      - REED_QDRANT_URL=http://qdrant:6333
      - REED_DATA_DIR=/data
      - REED_HOST=0.0.0.0
      - REED_PORT=8000
    volumes:
      - reed_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    healthcheck:
      # The image ships no curl or wget — bash's /dev/tcp is what is available.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  reed_data:
